<!DOCTYPE html>
<html lang="ru">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>DLS AI Login</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Inter,sans-serif;
    }

    body{

      height:100vh;

      display:flex;

      align-items:center;
      justify-content:center;

      overflow:hidden;

      background:
        radial-gradient(circle at top,#2563eb44,transparent),
        linear-gradient(180deg,#050816,#070b14);

      color:white;
    }

    body::before{

      content:"";

      position:absolute;

      width:700px;
      height:700px;

      background:
        linear-gradient(
          180deg,
          rgba(37,99,235,.25),
          rgba(168,85,247,.2)
        );

      filter:blur(120px);

      border-radius:50%;

      animation:float 10s ease infinite;
    }

    @keyframes float{

      0%{
        transform:translateY(0px);
      }

      50%{
        transform:translateY(40px);
      }

      100%{
        transform:translateY(0px);
      }

    }

    .login-box{

      position:relative;

      width:430px;

      padding:45px;

      border-radius:34px;

      background:
        rgba(15,23,42,.82);

      backdrop-filter:blur(24px);

      border:
        1px solid rgba(255,255,255,.08);

      box-shadow:
        0 20px 80px rgba(0,0,0,.45);

      z-index:10;
    }

    .logo{

      font-size:52px;

      font-weight:800;

      margin-bottom:12px;

      background:
        linear-gradient(
          90deg,
          #4f7cff,
          #9f67ff
        );

      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .sub{

      color:#94a3b8;

      margin-bottom:35px;
    }

    input{

      width:100%;

      padding:18px;

      margin-bottom:18px;

      border:none;

      outline:none;

      border-radius:18px;

      background:
        rgba(255,255,255,.05);

      color:white;

      font-size:15px;

      transition:.3s;
    }

    input:focus{

      background:
        rgba(255,255,255,.08);

      box-shadow:
        0 0 0 2px #4f7cff55;
    }

    button{

      width:100%;

      padding:18px;

      border:none;

      border-radius:18px;

      background:
        linear-gradient(
          90deg,
          #4f7cff,
          #9f67ff
        );

      color:white;

      font-size:16px;

      font-weight:600;

      cursor:pointer;

      transition:.3s;
    }

    button:hover{

      transform:translateY(-2px);

      box-shadow:
        0 15px 35px rgba(79,124,255,.35);
    }

    .bottom{

      margin-top:24px;

      text-align:center;

      color:#64748b;

      font-size:14px;
    }

  </style>

</head>

<body>

  <div class="login-box">

    <div class="logo">
      DLS AI
    </div>

    <div class="sub">
      School Dashboard System 😈
    </div>

    <input
      type="text"
      id="login"
      placeholder="Логин"
    >

    <input
      type="password"
      id="password"
      placeholder="Пароль"
    >

    <button onclick="login()">
      Войти
    </button>

    <div class="bottom">
      AI Powered School Platform
    </div>

  </div>

  <script>

    const accounts = {

      admin:"1234",

      ali:"1111",

      dimash:"2222",

      osman:"3333"

    };

    function login(){

      const login =
        document
          .getElementById("login")
          .value
          .toLowerCase()
          .trim();

      const password =
        document
          .getElementById("password")
          .value
          .trim();

      if(accounts[login] === password){

        localStorage.setItem(
          "dls_user",
          login
        );

        window.location.href =
          "index.html";

      }

      else{

        alert(
          "❌ Неверный логин"
        );

      }

    }

  </script>

</body>
</html>
